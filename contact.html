  <main>
    <section class="page-header"><p class="eyebrow">GET IN TOUCH</p><h1>Contact Us</h1><p>Have an idea, question or campus story? Send us a message.</p></section>
    <section class="form-section">
      <form id="contactForm" class="form-card">
        <div class="form-row"><div class="field"><label for="contactName">Name *</label><input id="contactName" required></div><div class="field"><label for="contactEmail">Email *</label><input id="contactEmail" type="email" required></div></div>
        <div class="field"><label for="subject">Subject *</label><input id="subject" required></div>
        <div class="field"><label for="message">Message *</label><textarea id="message" rows="7" required></textarea></div>
        <button class="btn" type="submit">Send Message</button><p id="contactMessage" class="form-message"></p>
      </form>
    </section>
  </main>
